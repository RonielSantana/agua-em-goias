# Atualiza os dados de todos os municípios de Goiás na API do SISAGUA e publica o site no GitHub Pages.
# Roda todo domingo às 03:00 (horário de Brasília) e também pelo botão "Run workflow" na aba Actions.
# Na primeira semana de cada mês (ou quando pedido) refaz também o cadastro (população e tratamento).
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      cadastro:
        description: "Refazer também o cadastro (população e tratamento), que leva cerca de 1 hora"
        type: boolean
        default: false
      municipios:
        description: "Só estes municípios (códigos IBGE de 6 dígitos separados por espaço); vazio = todos"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-e-publicar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decidir se refaz o cadastro
        id: cadastro
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.cadastro }}" = "true" ]; then echo "refazer=sim" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -le 7 ]; then echo "refazer=sim" >> "$GITHUB_OUTPUT";
          else echo "refazer=nao" >> "$GITHUB_OUTPUT"; fi

      - name: Cadastro de Goiás (mensal)
        if: steps.cadastro.outputs.refazer == 'sim'
        run: node scripts/cadastro-go.mjs

      - name: Guardar o cadastro no repositório
        if: steps.cadastro.outputs.refazer == 'sim'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cadastro
          git diff --cached --quiet || (git commit -m "Atualiza o cadastro de Goiás ($(date -u +%Y-%m-%d))" && git push)

      - name: Dados de todos os municípios de Goiás
        run: node scripts/atualizar.mjs $MUNICIPIOS
        env:
          MUNICIPIOS: ${{ inputs.municipios }}
          SIMULTANEOS: "2"
          PRAZO_MUNICIPIO: "12"
          TEMPO_TOTAL: "280"
          SITE_ANTERIOR: https://ronielsantana.github.io/agua-em-goias/
          SENHA_SITE: ${{ secrets.SENHA_SITE }}

      # Cifra os dados com a senha (segredo SENHA_SITE). Sem o segredo, para aqui e não publica nada aberto.
      - name: Cifrar os dados com a senha do site
        run: node scripts/criptografar.mjs
        env:
          SENHA_SITE: ${{ secrets.SENHA_SITE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
